<!DOCTYPE html>
<html lang="it">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Homepage - EventHub</title>
        <!-- Bulma -->
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css">
        <!-- icone Font Awesome -->
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css">
        <!-- CSS personalizzato (dopo Bulma, per sovrascriverne gli stili) -->
        <link rel="stylesheet" href="custom.css">
    </head>
    <body>
        <!-- navbar: uguale in tutte le pagine, cambia solo la voce attiva -->
        <header>
            <nav class="navbar" role="navigation" aria-label="Navigazione principale">
                <div class="container">
                    <div class="navbar-brand">
                        <a class="navbar-item" href="index.html">
                            <span class="icon"><i class="fas fa-ticket"></i></span>
                            <span class="title is-4">EventHub</span>
                        </a>
                    </div>
                    <!-- is-active: menu sempre visibile anche su mobile, senza hamburger -->
                    <div class="navbar-menu is-active">
                        <div class="navbar-start">
                            <a class="navbar-item is-active" href="index.html">Homepage</a>
                            <a class="navbar-item" href="eventi.html">Eventi</a>
                            <a class="navbar-item" href="contatti.html">Contatti</a>
                            <a class="navbar-item" href="faq.html">FAQ</a>
                        </div>
                        <div class="navbar-end">
                            <div class="navbar-item">
                                <a class="button is-primary" href="eventi.html">Scopri gli eventi</a>
                            </div>
                        </div>
                    </div>
                </div>
            </nav>
        </header>

        <main>
            <!-- hero: titolo principale della pagina, unico h1 -->
            <section class="hero is-medium">
                <div class="hero-body">
                    <div class="container">
                        <!-- testo e immagine affiancati su desktop, in colonna su mobile -->
                        <div class="columns is-vcentered">
                            <div class="column is-half">
                                <h1 class="title is-1">Trova il tuo prossimo evento</h1>
                                <p class="subtitle is-4">
                                    Concerti, partite, workshop, mostre e festival nella tua città:
                                    scopri gli eventi in programma, leggi i dettagli e scegli dove andare.
                                </p>
                                <div class="buttons">
                                    <a class="button is-primary is-medium" href="eventi.html">Vedi tutti gli eventi</a>
                                    <a class="button is-primary is-outlined is-medium" href="faq.html">Come funziona EventHub</a>
                                </div>
                            </div>
                            <div class="column is-half">
                                <figure class="image">
                                    <img src="https://images.unsplash.com/photo-1492684223066-81342ee5ff30?w=900&q=80" alt="Pubblico a un concerto sotto una pioggia di coriandoli">
                                </figure>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </main>

    </body>
</html>
